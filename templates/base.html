<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vidartcamp - Control de Acceso{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'Noto Sans', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen bg-gradient-to-b from-slate-50 to-white text-slate-900 font-sans">
    <nav
        class="sticky top-0 z-50 border-b border-white/10 bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 text-white shadow-sm">
        <div class="mx-auto max-w-6xl px-2 sm:px-4">
            <div class="flex items-center justify-between py-3 sm:py-4">
                <a href="/" class="flex items-center gap-2 sm:gap-3">
                    <img src="/static/images/logo.png" alt="Vidartcamp Logo" class="h-8 w-auto sm:h-10 object-contain">
                    <div class="leading-tight">
                        <div class="text-base sm:text-lg font-extrabold tracking-tight">Vidartcamp</div>
                        <div class="text-xs text-white/70 hidden xs:block">Control de acceso</div>
                    </div>
                </a>
                <div class="flex items-center gap-1 sm:gap-2">
                    {% block nav_links %}{% endblock %}
                </div>
            </div>
        </div>
    </nav>

    <main class="mx-auto w-full max-w-6xl px-2 sm:px-4 py-6 sm:py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200/70 py-6 sm:py-8 mt-6 sm:mt-10">
        <div class="mx-auto max-w-6xl px-2 sm:px-4 text-xs sm:text-sm text-slate-500 flex items-center justify-between">
            <p>&copy; 2025 Vidartcamp</p>
            <p class="hidden sm:block">Sistema de Control de Acceso</p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
