<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vidartcamp - Control de Acceso{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'Noto Sans', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        /* Estilos para menú hamburguesa responsive */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }

        .hamburger-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Media query para móvil (< 768px) */
        @media (max-width: 767px) {
            .hamburger-btn {
                display: block;
            }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: linear-gradient(to right, rgb(2, 6, 23), rgb(15, 23, 42), rgb(2, 6, 23));
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 0;
                max-height: 0;
                overflow: hidden;
                opacity: 0;
                transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            }

            .nav-links.show {
                max-height: 500px;
                opacity: 1;
                padding: 0.5rem 0;
            }

            .nav-links a {
                width: 100%;
                padding: 0.75rem 1rem;
                text-align: left;
                border-radius: 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .nav-links a:last-child {
                border-bottom: none;
            }

            .nav-links a:hover {
                background-color: rgba(255, 255, 255, 0.15);
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen bg-gradient-to-b from-slate-50 to-white text-slate-900 font-sans">
    <nav
        class="sticky top-0 z-50 border-b border-white/10 bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 text-white shadow-sm">
        <div class="mx-auto max-w-6xl px-2 sm:px-4">
            <div class="flex items-center justify-between py-3 sm:py-4 relative">
                <a href="/" class="flex items-center gap-2 sm:gap-3">
                    <img src="/static/images/logo.png" alt="Vidartcamp Logo" class="h-8 w-auto sm:h-10 object-contain">
                    <div class="leading-tight">
                        <div class="text-base sm:text-lg font-extrabold tracking-tight">Vidartcamp</div>
                        <div class="text-xs text-white/70 hidden xs:block">Control de acceso</div>
                    </div>
                </a>

                <!-- Botón hamburguesa (solo visible en móvil) -->
                <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>

                <!-- Enlaces de navegación -->
                <div class="nav-links" id="nav-links">
                    {% block nav_links %}{% endblock %}
                </div>
            </div>
        </div>
    </nav>

    <main class="mx-auto w-full max-w-6xl px-2 sm:px-4 py-6 sm:py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200/70 py-6 sm:py-8 mt-6 sm:mt-10">
        <div class="mx-auto max-w-6xl px-2 sm:px-4 text-xs sm:text-sm text-slate-500 flex items-center justify-between">
            <p>&copy; 2025 Vidartcamp</p>
            <p class="hidden sm:block">Sistema de Control de Acceso</p>
        </div>
    </footer>

    <!-- JavaScript para toggle del menú hamburguesa -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const hamburgerBtn = document.getElementById('hamburger-btn');
            const navLinks = document.getElementById('nav-links');

            if (hamburgerBtn && navLinks) {
                hamburgerBtn.addEventListener('click', function () {
                    navLinks.classList.toggle('show');
                });

                // Cerrar menú al hacer click en un enlace (mejor UX en móvil)
                const links = navLinks.querySelectorAll('a');
                links.forEach(link => {
                    link.addEventListener('click', function () {
                        navLinks.classList.remove('show');
                    });
                });

                // Cerrar menú al hacer click fuera
                document.addEventListener('click', function (event) {
                    if (!navLinks.contains(event.target) && !hamburgerBtn.contains(event.target)) {
                        navLinks.classList.remove('show');
                    }
                });
            }
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
