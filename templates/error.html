{% extends "base.html" %}

{% block title %}Error - Vidartcamp{% endblock %}

{% block nav_links %}
<a href="/" class="rounded-lg px-3 py-2 text-sm font-semibold text-white/90 hover:text-white hover:bg-white/10 transition">Inicio</a>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white/80 backdrop-blur rounded-2xl border border-slate-200 shadow-sm p-8">
        <h2 class="text-2xl font-extrabold tracking-tight text-slate-900 mb-2">No disponible</h2>
        <p class="text-slate-700 mb-6">{{ mensaje }}</p>

        <div class="flex items-center gap-3">
            <a href="/" class="bg-slate-900 text-white px-5 py-3 rounded-xl font-semibold hover:bg-slate-800 transition">Volver al inicio</a>
            <a href="/login" class="bg-white border border-slate-200 text-slate-900 px-5 py-3 rounded-xl font-semibold hover:bg-slate-50 transition">Ingresar</a>
        </div>
    </div>
</div>
{% endblock %}
