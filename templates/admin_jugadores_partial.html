{% if jugadores|length == 0 %}
<div class="px-4 py-4 text-sm text-gray-600">Sin jugadores activos.</div>
{% else %}
<div class="overflow-x-auto -mx-3 sm:mx-0">
    <table class="w-full text-xs sm:text-sm">
        <thead>
            <tr class="text-left text-gray-500 border-b">
                <th class="py-2 px-2 sm:px-3 sticky left-0 bg-white z-10 min-w-[140px]">Acciones</th>
                <th class="py-2 px-2 sm:px-3">Nombre</th>
                <th class="py-2 px-2 sm:px-3">DNI</th>
                <th class="py-2 px-2 sm:px-3">Equipo</th>
                <th class="py-2 px-2 sm:px-3 hidden md:table-cell">Teléfono</th>
                <th class="py-2 px-2 sm:px-3 hidden lg:table-cell">Email</th>
            </tr>
        </thead>
        <tbody>
            {% for jugador in jugadores %}
            <tr class="border-b last:border-b-0 align-top">
                <td class="py-2 sm:py-3 px-2 sm:px-3 sticky left-0 bg-white z-10">
                    <div class="flex items-center gap-1 sm:gap-2">
                        <form id="edit-jugador-{{ jugador.id }}" method="POST"
                            action="/admin/jugadores/editar" class="inline">
                            <input type="hidden" name="jugador_id" value="{{ jugador.id }}">
                            <button type="submit"
                                class="bg-blue-600 text-white px-2 sm:px-3 py-1 sm:py-2 rounded text-xs sm:text-sm font-semibold hover:bg-blue-700 transition whitespace-nowrap">
                                Guardar
                            </button>
                        </form>
                        <form method="POST" action="/admin/jugadores/borrar" class="inline"
                            onsubmit="return confirm('¿Eliminar a este jugador de la lista?');">
                            <input type="hidden" name="jugador_id" value="{{ jugador.id }}">
                            <button type="submit"
                                class="bg-red-600 text-white px-2 sm:px-3 py-1 sm:py-2 rounded text-xs sm:text-sm font-semibold hover:bg-red-700 transition whitespace-nowrap">
                                Borrar
                            </button>
                        </form>
                    </div>
                </td>
                <td class="py-2 sm:py-3 px-2 sm:px-3">
                    <input form="edit-jugador-{{ jugador.id }}" type="text"
                        name="nombre_completo" value="{{ jugador.nombre_completo }}"
                        class="w-full px-2 sm:px-3 py-1 sm:py-2 text-xs sm:text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </td>
                <td class="py-2 sm:py-3 px-2 sm:px-3">
                    <input form="edit-jugador-{{ jugador.id }}" type="text" name="dni"
                        value="{{ jugador.dni }}"
                        class="w-full px-2 sm:px-3 py-1 sm:py-2 text-xs sm:text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </td>
                <td class="py-2 sm:py-3 px-2 sm:px-3">
                    <select form="edit-jugador-{{ jugador.id }}" name="equipo_id"
                        class="w-full px-2 sm:px-3 py-1 sm:py-2 text-xs sm:text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                        required>
                        {% for equipo in equipos %}
                        <option value="{{ equipo.id }}" {% if equipo.id == jugador.equipo_id %}selected{% endif %}>{{ equipo.nombre }}</option>
                        {% endfor %}
                    </select>
                </td>
                <td class="py-2 sm:py-3 px-2 sm:px-3 hidden md:table-cell">
                    <input form="edit-jugador-{{ jugador.id }}" type="text" name="telefono"
                        value="{{ jugador.telefono or '' }}"
                        class="w-full px-2 sm:px-3 py-1 sm:py-2 text-xs sm:text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="-">
                </td>
                <td class="py-2 sm:py-3 px-2 sm:px-3 hidden lg:table-cell">
                    <input form="edit-jugador-{{ jugador.id }}" type="email" name="email"
                        value="{{ jugador.email or '' }}"
                        class="w-full px-2 sm:px-3 py-1 sm:py-2 text-xs sm:text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="-">
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endif %}
